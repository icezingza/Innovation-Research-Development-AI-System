# values.airgap.yaml
# Helm configuration for deploying NamoNexus in an Air-Gapped Kubernetes Environment

global:
  environment: "airgap"
  # Disables any features requiring internet access (e.g., GCP integrations, remote telemetry)
  disableExternalNetwork: true

replicaCount: 3
image:
  # In air-gapped mode, images must be pulled from the local private registry
  repository: harbor.local/namonexus/api
  tag: "v5.0.0-sovereign"
  pullPolicy: IfNotPresent
  
resources:
  requests:
    cpu: "1000m"
    memory: "2Gi"
  limits:
    cpu: "4000m"
    memory: "4Gi"
    
env:
  INFERENCE_MODE: "local"
  DEFAULT_MODEL: "llama3"
  OLLAMA_BASE_URL: "http://namo-ollama:11434"
  SECRETS_MANAGER: "local"
  ENFORCE_THAI_REGULATORY: "true"

inference:
  ollama:
    enabled: true
    image:
      repository: harbor.local/ollama/ollama
      tag: "latest"
    # Pre-loaded models persistence
    persistence:
      enabled: true
      size: 50Gi
      storageClass: "local-fast"
    resources:
      requests:
        cpu: "4000m"
        memory: "16Gi"
        # Requires GPU for latency < 10s
        nvidia.com/gpu: "1" 
      limits:
        nvidia.com/gpu: "1"

# Infrastructure dependencies (Should be deployed in the same private namespace)
postgresql:
  enabled: true
  architecture: "standalone" # Use replication in true prod
  auth:
    database: "cognition"
    username: "cognitive"
    # Password provided via local k8s secret

redis:
  enabled: true
  architecture: "standalone"

qdrant:
  enabled: true
  persistence:
    size: 20Gi

neo4j:
  enabled: true
  neo4j:
    password: "sovereign_graph_password"
