# values.airgap.yaml — Air-Gapped Kubernetes overrides
# Usage: helm install ird-ai ./k8s/namonexus -f k8s/namonexus/values.airgap.yaml \
#          --set secrets.dbPassword=<pw> --set secrets.neo4jPassword=<pw> \
#          --set secrets.apiKeys=<key> --set secrets.auditorApiKey=<key>

replicaCount: 2

image:
  repository: harbor.local/ird-ai/api   # private registry — no internet needed
  tag: "0.9.0"
  pullPolicy: IfNotPresent

config:
  environment: airgap
  inferenceMode: local
  disableExternalNetwork: "true"
  secretsManager: k8s
  defaultModel: llama3

resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "4"
    memory: "4Gi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 65

persistence:
  storageClass: "local-fast"
  postgres:
    size: 50Gi
  qdrant:
    size: 100Gi
  neo4j:
    size: 20Gi
  ollama:
    size: 200Gi    # sufficient for llama3 + mistral pre-loaded
