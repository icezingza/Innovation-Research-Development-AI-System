apiVersion: v1
kind: Secret
metadata:
  name: {{ .Chart.Name }}-secrets
  labels:
    app: {{ .Chart.Name }}
  annotations:
    # Rotate via: kubectl create secret generic ... --dry-run=client -o yaml | kubectl apply -f -
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  db-password: {{ required "secrets.dbPassword is required" .Values.secrets.dbPassword | quote }}
  neo4j-password: {{ required "secrets.neo4jPassword is required" .Values.secrets.neo4jPassword | quote }}
  api-keys: {{ required "secrets.apiKeys is required" .Values.secrets.apiKeys | quote }}
  auditor-api-key: {{ required "secrets.auditorApiKey is required" .Values.secrets.auditorApiKey | quote }}
