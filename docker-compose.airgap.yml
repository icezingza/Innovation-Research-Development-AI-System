version: '3.8'

services:
  # -------------------------
  # Inference (Air-Gapped Local)
  # -------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: namo_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # In a true air-gapped environment, the container image would be pulled 
    # from a local private registry and pre-loaded with models (llama3, mistral).
    
  # -------------------------
  # Core Infrastructure
  # -------------------------
  postgres:
    image: postgres:15-alpine
    container_name: namo_postgres
    environment:
      POSTGRES_USER: cognitive
      POSTGRES_PASSWORD: sovereign_db_password
      POSTGRES_DB: cognition
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: namo_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: namo_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: namo_neo4j
    environment:
      NEO4J_AUTH: neo4j/sovereign_graph_123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  # -------------------------
  # Application Layer
  # -------------------------
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: namo_api
    depends_on:
      - postgres
      - redis
      - qdrant
      - neo4j
      - ollama
    environment:
      - ENVIRONMENT=airgap
      # Database Connections
      - POSTGRES_URL=postgresql+asyncpg://cognitive:sovereign_db_password@postgres:5432/cognition
      - REDIS_URL=redis://redis:6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=sovereign_graph_123
      
      # Sovereign AI Configuration
      - INFERENCE_MODE=local
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODEL=llama3
      
      # Strict Security Guardrails
      - DISABLE_EXTERNAL_NETWORK=true
      - SECRETS_MANAGER=local # Bypass GCP Secret Manager
      - ENFORCE_THAI_REGULATORY=true
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  ollama_data:
  postgres_data:
  qdrant_data:
  neo4j_data:
